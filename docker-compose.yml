# Local container run for development and the persistence check.
#
#   GIT_SHA=$(git rev-parse HEAD) docker compose up --build
#   open http://localhost:8080
#
# Task data is kept in the named volume "tasktracker-data", so
# `docker compose down` followed by `up` keeps your tasks.
# `docker compose down -v` deletes them.
services:
  tasktracker:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: tasktracker:local
    container_name: tasktracker-local
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/tasktracker.db"
    volumes:
      - tasktracker-data:/app/data
    restart: unless-stopped

volumes:
  tasktracker-data:
